name: Docker image

# Builds the Egyptian image, starts it with docker/docker-compose.yml and checks
# it. The tested image is published on Docker Hub (mypalace/egyptian) for a
# version tag (v*) or when asked by hand (Actions > Docker image > Run workflow).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish on Docker Hub after the test'
        type: boolean
        default: false

env:
  IMAGE: mypalace/egyptian

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Version
        id: version
        run: |
          version=$(python3 -c "import re; print(re.search(r\"^__version__ = '([^']+)'\", open('mayan/__init__.py').read(), re.M).group(1))")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "series=s${version%.*}" >> "$GITHUB_OUTPUT"
          echo "Version ${version}"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Start with docker/docker-compose.yml
        working-directory: docker
        env:
          MAYAN_DOCKER_IMAGE_NAME: ${{ env.IMAGE }}
          MAYAN_DOCKER_IMAGE_TAG: test
          # GitHub runners have 4 CPUs; the Compose file limits the app to 6 by default.
          MAYAN_DOCKER_CPU_LIMIT: '4.0'
        run: |
          docker compose up --detach
          for i in $(seq 90); do
            if curl --silent --fail --output /tmp/login.html http://127.0.0.1/authentication/login/; then
              echo "Login page after about $((i * 10)) seconds"
              break
            fi
            sleep 10
          done
          sleep 60

      - name: Check
        working-directory: docker
        env:
          MAYAN_DOCKER_IMAGE_NAME: ${{ env.IMAGE }}
          MAYAN_DOCKER_IMAGE_TAG: test
          # GitHub runners have 4 CPUs; the Compose file limits the app to 6 by default.
          MAYAN_DOCKER_CPU_LIMIT: '4.0'
        run: |
          set -x
          test -s /tmp/login.html
          grep -q 'content="Egyptian" name="application-name"' /tmp/login.html
          grep -q 'appearance/images/egyptian-login' /tmp/login.html
          ! grep -q 'Guided Demo' /tmp/login.html
          curl --silent --fail --location --output /dev/null http://127.0.0.1/favicon.ico
          docker compose exec -T app supervisorctl status
          ! docker compose exec -T app supervisorctl status | grep -v RUNNING
          docker compose exec -T app /opt/mayan-edms/bin/python -c "import ezdxf, matplotlib, numpy, pillow_heif, pydicom, rawpy, stl"
          # No extension in the public image.
          ! docker compose exec -T app sh -c 'ls /opt/mayan-edms/lib/python3*/site-packages/mayan/apps/approvals/*.py'

      - name: Logs
        if: always()
        working-directory: docker
        env:
          MAYAN_DOCKER_IMAGE_NAME: ${{ env.IMAGE }}
          MAYAN_DOCKER_IMAGE_TAG: test
          # GitHub runners have 4 CPUs; the Compose file limits the app to 6 by default.
          MAYAN_DOCKER_CPU_LIMIT: '4.0'
        run: |
          docker compose logs app | tail -120
          docker compose down --volumes

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the tested image
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          for tag in "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.series }}" latest; do
            docker tag "${IMAGE}:test" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
