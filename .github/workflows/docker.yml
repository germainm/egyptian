name: Docker image

# Builds the Egyptian image, starts it with docker/docker-compose.yml and checks
# it. The tested image is published on Docker Hub (mypalace/egyptian) for a
# version tag (v*) or when asked by hand (Actions > Docker image > Run workflow).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish on Docker Hub after the test'
        type: boolean
        default: false

env:
  IMAGE: mypalace/egyptian

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Version
        id: version
        run: |
          version=$(python3 -c "import re; print(re.search(r\"^__version__ = '([^']+)'\", open('mayan/__init__.py').read(), re.M).group(1))")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "series=s${version%.*}" >> "$GITHUB_OUTPUT"
          echo "Version ${version}"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Start with docker/docker-compose.yml
        working-directory: docker
        env:
          MAYAN_DOCKER_IMAGE_NAME: ${{ env.IMAGE }}
          MAYAN_DOCKER_IMAGE_TAG: test
          # GitHub runners have 4 CPUs; the Compose file limits the app to 6 by default.
          MAYAN_DOCKER_CPU_LIMIT: '4.0'
        run: |
          docker compose up --detach
          for i in $(seq 90); do
            if curl --silent --fail --output /tmp/login.html http://127.0.0.1/authentication/login/; then
              echo "Login page after about $((i * 10)) seconds"
              break
            fi
            sleep 10
          done
          sleep 60

      - name: Check
        working-directory: docker
        env:
          MAYAN_DOCKER_IMAGE_NAME: ${{ env.IMAGE }}
          MAYAN_DOCKER_IMAGE_TAG: test
          # GitHub runners have 4 CPUs; the Compose file limits the app to 6 by default.
          MAYAN_DOCKER_CPU_LIMIT: '4.0'
        run: |
          set -x
          test -s /tmp/login.html
          grep -q 'content="Egyptian" name="application-name"' /tmp/login.html
          grep -q 'appearance/images/egyptian-login' /tmp/login.html
          ! grep -q 'Guided Demo' /tmp/login.html
          curl --silent --fail --location --output /dev/null http://127.0.0.1/favicon.ico
          docker compose exec -T app supervisorctl status
          ! docker compose exec -T app supervisorctl status | grep -v RUNNING
          docker compose exec -T app /opt/mayan-edms/bin/python -c "import ezdxf, matplotlib, numpy, pillow_heif, pydicom, rawpy, stl"
          # No extension in the public image.
          ! docker compose exec -T app sh -c 'ls /opt/mayan-edms/lib/python3*/site-packages/mayan/apps/approvals/*.py'

      - name: Process documents
        working-directory: docker
        env:
          MAYAN_DOCKER_IMAGE_NAME: ${{ env.IMAGE }}
          MAYAN_DOCKER_IMAGE_TAG: test
          MAYAN_DOCKER_CPU_LIMIT: '4.0'
        run: |
          base=http://127.0.0.1/api/v4
          api() {
            curl --silent --show-error --fail-with-body -H 'Accept: application/json' "$@" > /tmp/api.json \
              || { echo "API error:"; head -c 600 /tmp/api.json; echo; return 1; }
            jq -e . /tmp/api.json > /dev/null || { echo "Not JSON:"; head -c 600 /tmp/api.json; echo; return 1; }
            cat /tmp/api.json
          }
          # A new installation shows the password of its administrator on the login page.
          password=$(grep -o 'Password: <strong>[^<]*' /tmp/login.html | sed 's/.*<strong>//')
          test -n "${password}"
          token=$(api --data-urlencode username=admin --data-urlencode "password=${password}" "${base}/auth/token/obtain/" | jq -r .token)
          auth="Authorization: Token ${token}"
          type_id=$(api -H "${auth}" "${base}/document_types/" | jq '.results[0].id // empty')
          if [ -z "${type_id}" ]; then
            type_id=$(api -H "${auth}" -H 'Content-Type: application/json' -d '{"label": "Test"}' "${base}/document_types/" | jq .id)
          fi

          # Samples: text formats made here, the others with the tools of the image.
          mkdir -p /tmp/formats && cd /tmp/formats
          printf 'Egyptian Docker image test\nSecond line\n' > test.txt
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100"><rect width="200" height="100" fill="#e3a93f"/><text x="20" y="60" font-size="30">Egyptian</text></svg>\n' > test.svg
          printf '# Egyptian\n\nA *Markdown* test with a [link](https://example.com).\n' > test.md
          printf 'From: Test <test@example.com>\nTo: Egyptian <egyptian@example.com>\nSubject: Egyptian EML test\nDate: Thu, 29 Oct 2026 12:00:00 -0400\nMIME-Version: 1.0\nContent-Type: text/html; charset=utf-8\n\n<html><body><h1>Egyptian</h1><p>EML test.</p></body></html>\n' > test.eml
          printf 'solid t\nfacet normal 0 0 1\nouter loop\nvertex 0 0 0\nvertex 10 0 0\nvertex 0 10 0\nendloop\nendfacet\nendsolid t\n' > test.stl
          python3 - <<'PY'
          import zipfile
          container = ('<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">'
                       '<rootfiles><rootfile full-path="content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>')
          opf = ('<?xml version="1.0"?><package xmlns="http://www.idpf.org/2007/opf" version="2.0" unique-identifier="id">'
                 '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>Egyptian</dc:title>'
                 '<dc:identifier id="id">egyptian-test</dc:identifier><dc:language>en</dc:language></metadata>'
                 '<manifest><item id="c1" href="c1.xhtml" media-type="application/xhtml+xml"/>'
                 '<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/></manifest>'
                 '<spine toc="ncx"><itemref idref="c1"/></spine></package>')
          ncx = ('<?xml version="1.0"?><ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">'
                 '<head><meta name="dtb:uid" content="egyptian-test"/></head><docTitle><text>Egyptian</text></docTitle>'
                 '<navMap><navPoint id="n1" playOrder="1"><navLabel><text>Egyptian</text></navLabel>'
                 '<content src="c1.xhtml"/></navPoint></navMap></ncx>')
          page = ('<?xml version="1.0" encoding="utf-8"?><html xmlns="http://www.w3.org/1999/xhtml"><head><title>Egyptian</title></head>'
                  '<body><h1>Egyptian</h1><p>EPUB test.</p></body></html>')
          with zipfile.ZipFile('test.epub', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr(zipfile.ZipInfo('mimetype'), 'application/epub+zip')
              for name, content in (('META-INF/container.xml', container), ('content.opf', opf),
                                    ('toc.ncx', ncx), ('c1.xhtml', page)):
                  z.writestr(name, content)
          PY
          cd "${GITHUB_WORKSPACE}/docker"
          docker compose exec -T app sh -c '
            set -e
            mkdir -p /tmp/formats && cd /tmp/formats
            ffmpeg -loglevel error -f lavfi -i testsrc=duration=1:size=160x120:rate=5 -pix_fmt yuv420p -y test.mp4
            /opt/mayan-edms/bin/python -c "
          import numpy, ezdxf, pillow_heif
          from PIL import Image
          from pydicom.dataset import FileDataset, FileMetaDataset
          from pydicom.uid import ExplicitVRLittleEndian, SecondaryCaptureImageStorage, generate_uid
          Image.new(\"RGB\", (160, 120), \"orange\").save(\"test.ppm\")
          pillow_heif.register_heif_opener()
          Image.new(\"RGB\", (160, 120), \"orange\").save(\"test.heic\")
          drawing = ezdxf.new()
          drawing.modelspace().add_line((0, 0), (10, 10))
          drawing.saveas(\"test.dxf\")
          meta = FileMetaDataset()
          meta.MediaStorageSOPClassUID = SecondaryCaptureImageStorage
          meta.MediaStorageSOPInstanceUID = generate_uid()
          meta.TransferSyntaxUID = ExplicitVRLittleEndian
          ds = FileDataset(\"test.dcm\", {}, file_meta=meta, preamble=b\"\\0\" * 128)
          ds.SOPClassUID = meta.MediaStorageSOPClassUID
          ds.SOPInstanceUID = meta.MediaStorageSOPInstanceUID
          ds.Modality = \"OT\"
          ds.Rows, ds.Columns = 64, 64
          ds.SamplesPerPixel, ds.PhotometricInterpretation = 1, \"MONOCHROME2\"
          ds.BitsAllocated, ds.BitsStored, ds.HighBit, ds.PixelRepresentation = 8, 8, 7, 0
          ds.PixelData = (numpy.arange(64 * 64) % 256).astype(numpy.uint8).tobytes()
          ds.save_as(\"test.dcm\", enforce_file_format=True)
          "
            c44 test.ppm test.djvu
          '
          for f in test.mp4 test.heic test.dxf test.dcm test.djvu; do
            docker compose cp "app:/tmp/formats/${f}" "/tmp/formats/${f}"
          done

          failures=0
          for f in txt svg md eml epub djvu mp4 stl dxf dcm heic; do
            document_id=$(api -H "${auth}" -F "document_type_id=${type_id}" -F "file=@/tmp/formats/test.${f}" "${base}/documents/upload/" | jq .id)
            image_url=
            for i in $(seq 60); do
              image_url=$(api -H "${auth}" "${base}/documents/${document_id}/" | jq -r '.file_latest.pages_first.image_url // empty')
              [ -n "${image_url}" ] && break
              sleep 3
            done
            result="no page"
            if [ -n "${image_url}" ]; then
              for i in $(seq 20); do
                code=$(curl --silent -H "${auth}" --output "/tmp/formats/page-${f}.bin" --write-out '%{http_code} %{content_type}' "${image_url}")
                case "${code}" in 200\ image/*) break ;; esac
                sleep 5
              done
              result="${code} $(stat -c %s "/tmp/formats/page-${f}.bin") bytes"
            fi
            echo "${f}: ${result}"
            case "${result}" in 200\ image/*) ;; *) failures=$((failures + 1)) ;; esac
          done
          if [ "${failures}" -gt 0 ]; then
            docker compose logs app | grep -i -E "error|exception|traceback" | tail -60
            exit 1
          fi

      - name: Logs
        if: always()
        working-directory: docker
        env:
          MAYAN_DOCKER_IMAGE_NAME: ${{ env.IMAGE }}
          MAYAN_DOCKER_IMAGE_TAG: test
          # GitHub runners have 4 CPUs; the Compose file limits the app to 6 by default.
          MAYAN_DOCKER_CPU_LIMIT: '4.0'
        run: |
          docker compose logs app | tail -120
          docker compose down --volumes

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the tested image
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          for tag in "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.series }}" latest; do
            docker tag "${IMAGE}:test" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
