
[program:mayan-edms-gunicorn]
autorestart = %(ENV_MAYAN_SUPERVISOR_AUTORESTART)s
autostart = true
command = %(ENV_MAYAN_GUNICORN_BIN)s --bind %(ENV_MAYAN_GUNICORN_BIND_ADDRESS)s --chdir %(ENV_MAYAN_INSTALL_DIR)s --env DJANGO_SETTINGS_MODULE=%(ENV_MAYAN_SETTINGS_MODULE)s --limit-request-line %(ENV_MAYAN_GUNICORN_LIMIT_REQUEST_LINE)s --log-level %(ENV_MAYAN_GUNICORN_LOG_LEVEL)s --max-requests %(ENV_MAYAN_GUNICORN_MAX_REQUESTS)s --max-requests-jitter %(ENV_MAYAN_GUNICORN_REQUESTS_JITTER)s --no-control-socket %(ENV_MAYAN_GUNICORN_TEMPORARY_DIRECTORY)s --timeout %(ENV_MAYAN_GUNICORN_TIMEOUT)s --worker-class %(ENV_MAYAN_GUNICORN_WORKER_CLASS)s --workers %(ENV_MAYAN_GUNICORN_WORKERS)s mayan.wsgi
environment =
  DJANGO_SETTINGS_MODULE=%(ENV_MAYAN_SETTINGS_MODULE)s
redirect_stderr = true
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
user = mayan

[program:mayan-edms-worker_a]
autorestart = %(ENV_MAYAN_SUPERVISOR_AUTORESTART)s
autostart = true
command = nice -n %(ENV_MAYAN_WORKER_A_NICE_LEVEL)s %(ENV_COMMAND)s
environment =
  COMMAND = "%(ENV_MAYAN_PYTHON_BIN_DIR)scelery -A mayan worker %(ENV_MAYAN_WORKER_A_CONCURRENCY)s --hostname=mayan-edms-worker_a.%%h --loglevel=%(ENV_MAYAN_WORKER_LOG_LEVEL)s -Ofair --queues=converter,default %(ENV_MAYAN_WORKER_A_MAX_MEMORY_PER_CHILD)s %(ENV_MAYAN_WORKER_A_MAX_TASKS_PER_CHILD)s",
  DJANGO_SETTINGS_MODULE=%(ENV_MAYAN_SETTINGS_MODULE)s
killasgroup = true
numprocs = 1
priority = 998
startsecs = 10
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stopwaitsecs = 1
user = mayan

